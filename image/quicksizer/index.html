<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quicksizer | PWA Icon Generator | BSFreeTools</title>
    
    <meta name="description" content="Quickly make 192x192 and 512x512 PNG files. Instant client-side image resizer to generate perfectly proportioned PWA icons directly in your browser.">
    <link rel="canonical" href="https://bsfreetools.com/quicksizer/">
    <meta property="og:title" content="Quicksizer - PWA Icon Generator | BSFreeTools" />
    <meta property="og:description" content="Quickly make 192x192 and 512x512 PNG files for your web apps. 100% private." />
    <meta property="og:url" content="https://bsfreetools.com/quicksizer/" />
    <meta property="og:type" content="website" />
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#080809">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

    <style>
        :root {
            --bg-base: #080809;
            --card-bg: rgba(255, 255, 255, 0.015);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-secondary: #8A8A8E;
            --nav-bg: rgba(8, 8, 9, 0.8);
            --hover-light: rgba(255, 255, 255, 0.12);
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-secondary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            margin: 0; min-height: 100vh; -webkit-font-smoothing: antialiased;
        }

        .linear-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 0% 0%, rgba(255,255,255,0.03) 0%, transparent 40%), var(--bg-base);
        }

        .tool-container {
            max-width: 800px; margin: 160px auto 60px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 24px; padding: 3rem; text-align: center;
            backdrop-filter: blur(10px);
        }

        .drop-zone {
            border: 2px dashed var(--card-border);
            border-radius: 16px; padding: 40px; margin: 24px 0;
            transition: all 0.3s ease; cursor: pointer;
        }

        .drop-zone:hover {
            border-color: var(--text-main);
            background: var(--hover-light);
        }
        
        .drop-zone.dragover {
            border-color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .btn-primary {
            background: var(--text-main); color: var(--bg-base);
            padding: 14px 24px; border-radius: 99px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.15em; font-size: 11px;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
        }

        .btn-primary:hover:not(:disabled) { transform: scale(1.02); }
        
        .btn-secondary {
            background: transparent; color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 14px 24px; border-radius: 99px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.15em; font-size: 11px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            width: 100%;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--text-main);
        }

        .ad-container {
            max-width: 800px; margin: 2rem auto;
            border: 1px dashed var(--card-border);
            height: 90px; display: flex; align-items: center; justify-content: center;
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em;
        }

        #preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="linear-bg"></div>

    <nav class="fixed top-0 z-50 w-full px-10 py-6 flex items-center justify-between bg-[var(--nav-bg)] backdrop-blur-xl border-b border-[var(--card-border)]">
        <a href="/image/" class="text-[10px] font-bold uppercase tracking-[0.3em] text-[var(--text-main)] opacity-60 hover:opacity-100 transition-opacity">
            ← BACK TO IMAGE SUITE
        </a>
    </nav>

    <div class="tool-container">
        <h1 class="text-4xl font-black italic uppercase text-[var(--text-main)] tracking-tight leading-none">
            QUICKSIZER
        </h1>
        <p class="mt-6 text-sm font-medium leading-relaxed max-w-md mx-auto">
            Quickly make 192x192 and 512x512 PNG files for your PWA manifests. No server uploads required.
        </p>

        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('imageInput').click()">
            <p id="file-label" class="text-[10px] font-black uppercase tracking-[0.2em] text-[var(--text-main)]">
                Drop image here or click to select
            </p>
            <input type="file" id="imageInput" accept="image/*" class="hidden">
        </div>

        <div id="previewContainer" class="hidden flex-col gap-8 w-full max-w-md mx-auto">
            <img id="preview" src="" alt="Image preview">
            
            <div class="grid grid-cols-2 gap-4">
                <button onclick="downloadIcon(192)" class="btn-secondary">Get 192x192</button>
                <button onclick="downloadIcon(512)" class="btn-secondary">Get 512x512</button>
            </div>
            
            <div class="flex flex-col gap-4 mt-2">
                <button onclick="generateAllIcons()" class="btn-primary">Generate All Icons → ZIP</button>
                <button onclick="shareImage()" class="text-[10px] font-bold uppercase tracking-widest text-emerald-500 hover:text-emerald-400 transition-colors">Share 512x512 Asset</button>
            </div>
        </div>
    </div>

    <div class="ad-container">
        <span>Advertisement Space</span>
    </div>

    <footer class="mt-auto py-12 text-center">
        <div class="mb-6">
            <a href="https://ko-fi.com/bsfreetools" target="_blank" class="text-[10px] font-black uppercase tracking-widest opacity-40 hover:opacity-100 transition-opacity border border-white/10 px-6 py-2 rounded-full">
                Support via Ko-fi
            </a>
        </div>
        <p class="text-[10px] font-black uppercase tracking-[1em] opacity-20">Distributed by BSFREETOOLS.COM</p>
    </footer>

    <script>
        const imageInput = document.getElementById('imageInput');
        const preview = document.getElementById('preview');
        const previewContainer = document.getElementById('previewContainer');
        const dropZone = document.getElementById('drop-zone');
        let currentImage = null;

        function handleImage(file) {
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    preview.src = e.target.result;
                    previewContainer.classList.remove('hidden');
                    previewContainer.classList.add('flex');
                    dropZone.style.display = 'none';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Event Listeners
        imageInput.addEventListener('change', e => handleImage(e.target.files[0]));
        dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', e => { e.preventDefault(); dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', e => { 
            e.preventDefault(); 
            dropZone.classList.remove('dragover'); 
            handleImage(e.dataTransfer.files[0]); 
        });

        // Centralized drawing function
        function drawToCanvas(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Improve downscaling quality
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            const scale = Math.max(size / currentImage.width, size / currentImage.height);
            const w = currentImage.width * scale;
            const h = currentImage.height * scale;
            const x = (size - w) / 2;
            const y = (size - h) / 2;
            
            ctx.clearRect(0, 0, size, size);
            ctx.drawImage(currentImage, 0, 0, currentImage.width, currentImage.height, x, y, w, h);
            return canvas;
        }

        function downloadIcon(size) {
            if (!currentImage) return;
            const canvas = drawToCanvas(size);

            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon-${size}x${size}.png`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            }, 'image/png');
        }

        async function generateAllIcons() {
            if (!currentImage) return;
            const sizes = [48, 72, 96, 144, 192, 512];
            const zip = new JSZip();

            for (const size of sizes) {
                const canvas = drawToCanvas(size);
                const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                zip.file(`icon-${size}x${size}.png`, blob);
            }

            zip.generateAsync({type: "blob"}).then(content => {
                const url = URL.createObjectURL(content);
                const a = document.createElement('a');
                a.href = url; 
                a.download = 'pwa-icons.zip';
                document.body.appendChild(a); 
                a.click(); 
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            });
        }

        // Web Share API
        async function shareImage() {
            if (!currentImage) return;
            
            const canvas = drawToCanvas(512);
            
            canvas.toBlob(async (blob) => {
                const file = new File([blob], 'shared-image.png', { type: 'image/png' });
                
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Quicksizer',
                            text: 'Here is the resized asset.',
                            files: [file]
                        });
                    } catch (err) {
                        console.log('Share failed:', err);
                    }
                } else {
                    alert('File sharing is not supported on this browser/device.');
                }
            }, 'image/png');
        }

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
              .then(registration => {
                console.log('ServiceWorker registration successful with scope: ', registration.scope);
              }, err => {
                console.log('ServiceWorker registration failed: ', err);
              });
          });
        }
    </script>
</body>
</html>
