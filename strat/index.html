<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>StratSilo | Tactical OS v3.5.1</title>
    <meta name="description" content="Strategic management and tactical planning tool for client silos and project tracking.">
    <link rel="canonical" href="https://bsfreetools.com/strat/" />
    
    <meta property="og:title" content="StratSilo | Tactical OS">
    <meta property="og:description" content="High-efficiency strategic planning and client management interface.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bsfreetools.com/strat/">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --ion-safe-area-top: 20px; --ion-safe-area-bottom: 20px; }
        body { 
            -webkit-tap-highlight-color: transparent; 
            font-family: system-ui, -apple-system, sans-serif; 
            overflow: hidden; 
            background: #cbd5e1; 
            color: #0f172a; 
            min-width: 0; 
        }
        
        @media (min-width: 1024px) {
            body { min-width: 1024px; }
        }

        @media (max-width: 1366px) {
            .silo-sidebar { width: min(400px, 100%) !important; max-width: 100%; }
        }

        /* Calendar & Rail */
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; background-color: #475569; border: 4px solid #1e293b; border-radius: 2rem; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .day-cell { min-height: 130px; background: #f8fafc; padding: 12px; cursor: pointer; border: 1px solid #94a3b8; transition: background 0.1s; }
        .day-cell:hover { background: #e2e8f0; }
        .day-label { font-weight: 900; color: #1e293b; font-size: 1.5rem; pointer-events: none; }
        
        .month-rail-btn { width: 100%; padding: 10px; font-weight: 900; font-size: 10px; text-transform: uppercase; color: #475569; border-radius: 12px; margin-bottom: 4px; transition: 0.2s; }
        .month-active { background: #4338ca !important; color: white !important; }
        .summarized-active { background-color: #1e1b4b !important; color: white !important; border-color: #312e81 !important; box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.3); }

        /* Pinned Command Toolbelt */
        .command-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 1rem 3rem; background: #f1f5f9; border-bottom: 4px solid #94a3b8; position: sticky; top: 0; z-index: 40; }
        .cmd-btn { padding: 8px 14px; background: white; border: 2px solid #475569; border-radius: 8px; font-weight: 800; font-size: 10px; color: #1e293b; text-transform: uppercase; cursor: pointer; outline: none; }
        .cmd-btn:hover { background: #e2e8f0; }
        
        /* Fast Color Swatches */
        .swatch-group { display: flex; gap: 4px; padding: 0 10px; border-left: 2px solid #cbd5e1; align-items: center; }
        .color-label { font-size: 9px; font-weight: 900; color: #64748b; text-transform: uppercase; margin-right: 4px; }
        .swatch { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #94a3b8; cursor: pointer; transition: transform 0.1s; }
        .swatch:hover { transform: scale(1.2); border-color: #1e293b; }

        /* Tactical Surfaces & Tables */
        .rich-surface { background: #f8fafc; padding: 2.5rem; outline: none; line-height: 1.8; font-size: 1.1rem; color: #0f172a; border: 3px solid #64748b; border-radius: 1.5rem; }
        .rich-surface table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; background: white; }
        .rich-surface td { border: 3px solid #475569; padding: 14px; vertical-align: top; word-break: break-word; min-height: 60px; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .hidden { display: none !important; }
        .workload-bar { height: 12px; width: 100%; border-radius: 4px; margin-top: 2px; display: flex; align-items: center; justify-content: center; color: white; font-size: 9px; font-weight: 900; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <nav class="bg-white border-b-8 border-indigo-800 px-4 sm:px-8 pt-8 sm:pt-12 pb-4 sm:pb-6 flex flex-col gap-4 sm:flex-row sm:justify-between sm:items-center z-50">
        <div class="flex flex-col sm:flex-row sm:items-center gap-4 sm:gap-6 min-w-0">
            <select id="activeProject" onchange="syncUI()" class="font-black text-3xl sm:text-5xl text-indigo-900 outline-none bg-transparent tracking-tighter cursor-pointer min-w-0 max-w-full"></select>
            <button id="masterBtn" onclick="toggleMaster()" class="px-6 sm:px-8 py-3 border-4 border-indigo-200 text-indigo-700 rounded-3xl font-black text-xs uppercase hover:bg-indigo-50 transition-all shrink-0">Summarized View</button>
        </div>
        <button onclick="toggleVault()" class="p-4 px-8 sm:px-10 bg-slate-900 rounded-[2rem] font-black text-xs uppercase text-white shadow-2xl hover:bg-slate-800 transition-colors shrink-0">🛡️ System Vault</button>
    </nav>

    <div class="flex flex-1 overflow-hidden min-h-0">
        <aside class="w-24 sm:w-32 bg-slate-200 border-r-4 border-slate-400 p-2 sm:p-3 flex flex-col items-center overflow-y-auto no-scrollbar shrink-0">
            <div class="w-full mb-6 mt-4">
                <label class="text-[9px] font-black text-slate-500 uppercase mb-2 block text-center">Year</label>
                <select id="yearPicker" onchange="updateYear(this.value)" class="w-full bg-white border-2 border-slate-400 rounded-xl p-2 font-black text-indigo-700 text-center text-sm outline-none cursor-pointer"></select>
            </div>
            <div id="monthGrid" class="flex flex-col w-full gap-1"></div>
        </aside>

        <main class="flex-1 overflow-y-auto no-scrollbar p-4 sm:p-12 min-w-0">
            <h2 id="mainDateHeader" class="text-4xl sm:text-7xl font-black italic text-slate-900 uppercase tracking-tighter mb-6 sm:mb-10 ml-0 sm:ml-4 break-words"></h2>
            <div id="calendarGrid" class="calendar-grid mx-auto max-w-full"></div>
        </main>
    </div>

    <div id="vaultMenu" class="fixed inset-0 bg-slate-900/95 z-[300] hidden flex items-center justify-center p-4 sm:p-6 backdrop-blur-xl">
        <div class="bg-white w-full max-w-4xl rounded-[2rem] sm:rounded-[4rem] p-8 sm:p-16 shadow-2xl overflow-y-auto max-h-[90vh]">
            <h3 class="font-black text-3xl sm:text-6xl mb-8 sm:mb-12 text-center uppercase italic text-indigo-900">System Vault</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 sm:gap-16 mb-8 sm:mb-16">
                <div class="bg-slate-50 p-6 sm:p-10 rounded-[2rem] sm:rounded-[3rem] border-4 border-slate-200">
                    <label class="text-[12px] font-black text-indigo-600 uppercase block mb-6">Tag Architect</label>
                    <div id="tagBuilder" class="space-y-4 mb-6"></div>
                    <button onclick="addTagRow()" class="w-full py-4 border-2 border-dashed border-indigo-300 text-indigo-500 font-bold text-xs rounded-2xl hover:bg-indigo-50">+ New Tag</button>
                </div>
                <div class="bg-slate-50 p-6 sm:p-10 rounded-[2rem] sm:rounded-[3rem] border-4 border-slate-200">
                    <label class="text-[12px] font-black text-indigo-600 uppercase block mb-6">Client Silos</label>
                    <div id="projectBuilder" class="space-y-4 mb-6"></div>
                    <button onclick="addProjectRow()" class="w-full py-4 border-2 border-dashed border-indigo-300 text-indigo-500 font-bold text-xs rounded-2xl hover:bg-indigo-50">+ New Silo</button>
                </div>
            </div>
            <button onclick="applyVault()" class="w-full py-6 sm:py-8 bg-indigo-700 text-white rounded-[2rem] sm:rounded-[2.5rem] font-black text-lg sm:text-2xl shadow-2xl uppercase hover:bg-indigo-800 transition-colors">Apply & Sync</button>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6 mt-6">
                <button onclick="downloadBackup()" class="py-4 border-4 border-slate-200 rounded-2xl text-[11px] font-black text-slate-500 uppercase hover:bg-slate-100">Backup JSON</button>
                <button onclick="exportAllToCSV()" class="py-4 bg-slate-200 rounded-2xl text-[11px] font-black text-slate-700 uppercase hover:bg-slate-300">Export CSV</button>
            </div>
            <button onclick="toggleVault()" class="w-full mt-6 py-4 text-slate-400 font-black text-sm uppercase text-center block tracking-widest hover:text-slate-600">Close Vault Without Saving</button>
        </div>
    </div>

    <div id="drillDownMenu" class="fixed inset-0 bg-slate-900/80 z-[400] hidden flex items-center justify-center p-4 sm:p-6 backdrop-blur-xl">
        <div class="bg-white w-full max-w-md rounded-[2rem] sm:rounded-[3rem] p-8 sm:p-12 shadow-2xl text-center border-4 border-slate-200">
            <h3 class="font-black text-xl sm:text-2xl mb-6 sm:mb-8 text-indigo-900 uppercase tracking-widest italic">Select Client Silo</h3>
            <div id="drillDownOptions" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar px-2"></div>
            <button onclick="closeDrillDown()" class="mt-8 sm:mt-10 text-slate-400 font-black text-sm uppercase tracking-widest hover:text-slate-600 transition-colors">Cancel</button>
        </div>
    </div>

    <div id="editorModal" class="fixed inset-0 bg-slate-100 z-[150] hidden flex flex-col transition-transform transform translate-y-full">
        <header class="p-4 sm:p-8 pt-12 sm:pt-16 border-b-4 border-slate-400 flex flex-col gap-4 lg:flex-row lg:justify-between lg:items-center bg-white sticky top-0 z-50">
            <div class="flex gap-2 sm:gap-4 items-center order-2 lg:order-1">
                <button id="saveBtn" onclick="saveNoteFeedback()" class="bg-indigo-700 text-white px-6 sm:px-10 py-4 sm:py-5 rounded-[2rem] font-black text-xs sm:text-sm shadow-xl hover:bg-indigo-800 transition-colors w-40 sm:w-48 shrink-0">SAVE NOTE</button>
                <button onclick="handleDone()" class="text-indigo-700 font-black text-lg sm:text-2xl tracking-tighter uppercase px-2 sm:px-6 hover:text-indigo-900 transition-colors">DONE</button>
            </div>
            <div class="text-center lg:absolute lg:left-1/2 lg:-translate-x-1/2 order-1 lg:order-none min-w-0 px-2">
                <h1 id="editClientName" class="text-3xl sm:text-5xl lg:text-7xl font-black text-indigo-900 uppercase tracking-tighter italic break-words">CLIENT</h1>
                <h3 id="editDate" class="font-black text-slate-500 text-lg sm:text-2xl uppercase italic">DATE</h3>
            </div>
            <div class="flex gap-2 sm:gap-4 justify-end order-3 lg:order-2">
                <button type="button" onclick="navDay(-1)" class="p-4 sm:p-5 bg-slate-100 border-4 border-slate-300 rounded-2xl font-black text-xl sm:text-2xl hover:bg-slate-200">◄</button>
                <button type="button" onclick="navDay(1)" class="p-4 sm:p-5 bg-slate-100 border-4 border-slate-300 rounded-2xl font-black text-xl sm:text-2xl hover:bg-slate-200">►</button>
            </div>
        </header>

        <div class="flex-1 flex flex-col lg:flex-row overflow-hidden min-h-0">
            <div class="flex-1 flex flex-col overflow-hidden min-h-0 min-w-0">
                <div class="command-bar px-4 sm:px-8 lg:px-12">
                    <button type="button" onmousedown="event.preventDefault(); applyFormatting('bold')" class="cmd-btn">Bold</button>
                    <button type="button" onmousedown="event.preventDefault(); applyFormatting('italic')" class="cmd-btn italic">Italic</button>
                    <select onchange="applyFormatting('fontSize', this.value); this.value='';" class="cmd-btn"><option value="">SIZE</option><option value="3">Normal</option><option value="5">Large</option><option value="7">Giant</option></select>
                    <select onchange="insertTable(this.value); this.value='';" class="cmd-btn"><option value="">+ TABLE</option><option value="2x2">2x2</option><option value="3x3">3x3</option><option value="4x2">4x2</option></select>

                    <div class="swatch-group">
                        <span class="color-label">Text:</span>
                        <div class="swatch" style="background-color: #000000;" onmousedown="event.preventDefault(); applyFormatting('foreColor', '#000000')"></div>
                        <div class="swatch" style="background-color: #475569;" onmousedown="event.preventDefault(); applyFormatting('foreColor', '#475569')"></div>
                        <div class="swatch" style="background-color: #1e3a8a;" onmousedown="event.preventDefault(); applyFormatting('foreColor', '#1e3a8a')"></div>
                        <div class="swatch" style="background-color: #991b1b;" onmousedown="event.preventDefault(); applyFormatting('foreColor', '#991b1b')"></div>
                        <div class="swatch" style="background-color: #166534;" onmousedown="event.preventDefault(); applyFormatting('foreColor', '#166534')"></div>
                        <div class="swatch" style="background-color: #6b21a8;" onmousedown="event.preventDefault(); applyFormatting('foreColor', '#6b21a8')"></div>
                    </div>

                    <div class="swatch-group">
                        <span class="color-label">BG:</span>
                        <div class="swatch" style="background-color: #fef08a;" onmousedown="event.preventDefault(); applyFormatting('hiliteColor', '#fef08a')"></div>
                        <div class="swatch" style="background-color: #bbf7d0;" onmousedown="event.preventDefault(); applyFormatting('hiliteColor', '#bbf7d0')"></div>
                        <div class="swatch" style="background-color: #bfdbfe;" onmousedown="event.preventDefault(); applyFormatting('hiliteColor', '#bfdbfe')"></div>
                        <div class="swatch" style="background-color: #fbcfe8;" onmousedown="event.preventDefault(); applyFormatting('hiliteColor', '#fbcfe8')"></div>
                        <div class="swatch" style="background-color: #e2e8f0;" onmousedown="event.preventDefault(); applyFormatting('hiliteColor', '#e2e8f0')"></div>
                        <div class="swatch" style="background-color: #ffffff;" onmousedown="event.preventDefault(); applyFormatting('hiliteColor', '#ffffff')"></div>
                    </div>

                    <div class="flex-1 min-w-[1rem]"></div>
                    <div id="tagBar" class="flex gap-2 flex-wrap"></div>
                </div>

                <div class="flex-1 overflow-y-auto p-4 sm:p-8 lg:p-12 no-scrollbar min-h-0">
                    <div id="actionContainer" class="space-y-3 mb-6"></div>
                    <button type="button" onclick="addActionRow()" class="text-[11px] font-black text-indigo-700 uppercase underline mb-10">+ Add Action Item</button>
                    <div id="strategySurface" contenteditable="true" oninput="markDirty()" class="rich-surface min-h-[320px] sm:min-h-[500px] lg:min-h-[700px]"></div>
                    <div class="mt-10 sm:mt-16 pt-10 sm:pt-16 border-t-4 border-slate-400">
                        <label class="text-[11px] font-black text-slate-500 uppercase block mb-6">Asset Hub</label>
                        <div id="assetLinks" contenteditable="true" oninput="markDirty()" class="rich-surface min-h-[120px] sm:min-h-[200px] bg-slate-100"></div>
                    </div>
                </div>
            </div>

            <aside class="silo-sidebar bg-white border-t-4 lg:border-t-0 lg:border-l-4 border-slate-400 flex flex-col overflow-hidden min-h-[40vh] lg:min-h-0 lg:w-[500px] lg:max-w-[500px] lg:flex-shrink-0 w-full">
                <div class="p-6 sm:p-8 font-black text-indigo-600 text-[12px] uppercase border-b-4 border-slate-200 shrink-0">Strategy Guardrail</div>
                <div id="strategyBullets" contenteditable="true" oninput="markDirty()" class="rich-surface flex-1 overflow-y-auto border-none rounded-none bg-slate-50 min-h-[200px]"></div>
            </aside>
        </div>
    </div>

    <script>
        let db, config, activeKey, isDirty = false, lastFocusEl;
        const months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
        let viewDate = new Date();
        let isSummarizedView = false;

        function escapeHtmlAttr(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/</g, '&lt;');
        }

        function escapeHtmlText(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function csvEscapeField(value) {
            const s = String(value ?? '');
            if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
            return s;
        }

        function htmlToPlainText(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html || '';
            return (tmp.textContent || tmp.innerText || '').replace(/\r\n|\r|\n/g, ' ').trim();
        }

        function boot() {
            try {
                db = JSON.parse(localStorage.getItem('hub_db')) || { entries: {}, strategy: {} };
            } catch (e) {
                db = { entries: {}, strategy: {} };
            }
            try {
                config = JSON.parse(localStorage.getItem('hub_config')) || { 
                    projects: ["CLIENT 1"], 
                    tags: [{name: "SHOOT", color: "#ef4444"}, {name: "DRAFT", color: "#3b82f6"}, {name: "ADMIN", color: "#10b981"}] 
                };
            } catch (e) {
                config = { projects: ["CLIENT 1"], tags: [{name: "SHOOT", color: "#ef4444"}, {name: "DRAFT", color: "#3b82f6"}, {name: "ADMIN", color: "#10b981"}] };
            }
            if (!config.projects || config.projects.length === 0) config.projects = ["CLIENT 1"];
            initYearPicker();
            document.execCommand("styleWithCSS", false, true);
            document.querySelectorAll('[contenteditable="true"]').forEach(el => {
                el.addEventListener('focus', () => lastFocusEl = el);
                el.addEventListener('mouseup', () => lastFocusEl = el);
                el.addEventListener('keyup', () => lastFocusEl = el);
            });
            window.addEventListener('beforeunload', (e) => {
                const modal = document.getElementById('editorModal');
                if (modal && !modal.classList.contains('hidden') && isDirty) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            });
            syncNav(); renderCalendar();
        }

        function initYearPicker() {
            const picker = document.getElementById('yearPicker');
            const currentYear = new Date().getFullYear();
            picker.innerHTML = '';
            for(let i = currentYear - 1; i <= currentYear + 3; i++) {
                const opt = document.createElement('option');
                opt.value = i; opt.innerText = i;
                if(i === viewDate.getFullYear()) opt.selected = true;
                picker.appendChild(opt);
            }
        }

        function updateYear(val) { viewDate.setFullYear(parseInt(val, 10)); renderCalendar(); }
        function jumpToMonth(i) { viewDate.setMonth(i); renderCalendar(); }
        function applyFormatting(cmd, val = null) { const t = lastFocusEl || document.getElementById('strategySurface'); t.focus(); if (cmd === 'hiliteColor') { if (!document.execCommand('hiliteColor', false, val)) document.execCommand('backColor', false, val); } else document.execCommand(cmd, false, val); markDirty(); }
        function insertTable(dims) { if (!dims) return; const t = lastFocusEl || document.getElementById('strategySurface'); t.focus(); const [rows, cols] = dims.split('x').map(Number); let html = '<br><table><tbody>'; for (let r = 0; r < rows; r++) { html += '<tr>'; for (let c = 0; c < cols; c++) html += '<td>&nbsp;</td>'; html += '</tr>'; } html += '</tbody></table><br>'; document.execCommand('insertHTML', false, html); markDirty(); }
        function insertHeading(name, color) {
            const t = lastFocusEl || document.getElementById('strategySurface');
            t.focus();
            const safe = /^#[0-9A-Fa-f]{6}$/.test(String(color)) ? color : '#475569';
            const html = `<div><br></div><div style="color:${safe}; font-weight:900; font-size:1.3rem;">[ ${escapeHtmlText(name)} ]</div><div>&nbsp;</div>`;
            document.execCommand('insertHTML', false, html);
            markDirty();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            const client = document.getElementById('activeProject').value || config.projects[0];
            const m = viewDate.getMonth(), y = viewDate.getFullYear();
            document.getElementById('mainDateHeader').innerText = `${months[m]} ${y}`;
            document.getElementById('monthGrid').innerHTML = months.map((name, i) => `<button type="button" onclick="jumpToMonth(${i})" class="month-rail-btn ${m === i ? 'month-active' : ''}">${name}</button>`).join('');
            const firstDay = new Date(y, m, 1).getDay();
            const lastDate = new Date(y, m + 1, 0).getDate();
            let gridHtml = '';
            for(let i=0; i<firstDay; i++) gridHtml += `<div class="day-cell bg-slate-400/40 border-none"></div>`;
            for(let d=1; d<=lastDate; d++) {
                const key = `${y}-${m+1}-${d}`;
                let bars = '';
                config.tags.forEach((tag) => {
                    let count = 0;
                    if (isSummarizedView) config.projects.forEach(p => { if ((db.entries[p]?.[key]?.html || "").toUpperCase().includes(tag.name)) count++; });
                    else if ((db.entries[client]?.[key]?.html || "").toUpperCase().includes(tag.name)) count = 1;
                    if(count > 0) bars += `<div class="workload-bar" style="background:${tag.color}">${tag.name.charAt(0)}</div>`;
                });
                gridHtml += `<div class="day-cell" onclick="handleDayClick('${key}')"><span class="day-label">${d}</span><div class="mt-auto flex flex-col gap-1">${bars}</div></div>`;
            }
            grid.innerHTML = gridHtml;
        }

        function handleDayClick(key) {
            if (!isSummarizedView) openEditor(key);
            else {
                const wrap = document.getElementById('drillDownOptions');
                wrap.innerHTML = '';
                config.projects.forEach(p => {
                    const hasData = db.entries[p] && db.entries[p][key] && (db.entries[p][key].html || (db.entries[p][key].actions && db.entries[p][key].actions.length > 0));
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'w-full py-5 bg-slate-50 border-4 border-slate-300 rounded-3xl font-black text-indigo-800 uppercase flex items-center justify-center break-words gap-2';
                    btn.appendChild(document.createTextNode(p));
                    if (hasData) {
                        const dot = document.createElement('span');
                        dot.className = 'text-emerald-500 text-2xl leading-none';
                        dot.textContent = '●';
                        btn.appendChild(dot);
                    }
                    btn.addEventListener('click', () => drillInto(p, key));
                    wrap.appendChild(btn);
                });
                document.getElementById('drillDownMenu').classList.remove('hidden');
            }
        }

        function drillInto(p, k) { document.getElementById('activeProject').value = p; document.getElementById('drillDownMenu').classList.add('hidden'); openEditor(k); }
        function closeDrillDown() { document.getElementById('drillDownMenu').classList.add('hidden'); }

        function openEditor(key) {
            activeKey = key;
            const client = document.getElementById('activeProject').value || config.projects[0];
            const entry = (db.entries[client] || {})[key] || { html: '', links: '', actions: [] };
            document.getElementById('editClientName').innerText = client;
            document.getElementById('strategySurface').innerHTML = entry.html;
            document.getElementById('assetLinks').innerHTML = entry.links || '';
            document.getElementById('strategyBullets').innerHTML = db.strategy[client] || "";
            document.getElementById('actionContainer').innerHTML = '';
            (entry.actions || []).forEach(a => addActionRow(a.text, a.done));
            if(!entry.actions?.length) addActionRow();
            const [y, m, d] = key.split('-');
            document.getElementById('editDate').innerText = `${months[m-1]} ${d}, ${y}`;
            const tagBar = document.getElementById('tagBar');
            tagBar.innerHTML = '';
            config.tags.forEach(t => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'px-3 py-1 rounded-full font-black text-[9px] uppercase hover:bg-slate-50 transition-all';
                b.style.border = `2px solid ${t.color}`;
                b.style.color = t.color;
                b.textContent = t.name;
                b.addEventListener('mousedown', (e) => { e.preventDefault(); insertHeading(t.name, t.color); });
                tagBar.appendChild(b);
            });
            document.getElementById('editorModal').classList.remove('hidden');
            setTimeout(() => { document.getElementById('editorModal').classList.remove('translate-y-full'); const mainSurface = document.getElementById('strategySurface'); mainSurface.focus(); lastFocusEl = mainSurface; }, 10);
            isDirty = false;
        }

        function saveNoteLogic() {
            const client = document.getElementById('activeProject').value;
            if (!client) {
                alert('No client silo selected; could not save.');
                return false;
            }
            if (!activeKey) return false;
            try {
                const actions = Array.from(document.querySelectorAll('.action-row')).map(row => ({
                    text: row.querySelector('input').value,
                    done: row.querySelector('.status-box').classList.contains('bg-indigo-600')
                }));
                if(!db.entries[client]) db.entries[client] = {};
                db.entries[client][activeKey] = {
                    html: document.getElementById('strategySurface').innerHTML,
                    links: document.getElementById('assetLinks').innerHTML,
                    actions: actions
                };
                db.strategy[client] = document.getElementById('strategyBullets').innerHTML;
                localStorage.setItem('hub_db', JSON.stringify(db));
                isDirty = false;
                return true;
            } catch (e) {
                alert('Save failed: ' + (e && e.message ? e.message : String(e)));
                return false;
            }
        }

        function saveNoteFeedback() {
            if (!saveNoteLogic()) return;
            const btn = document.getElementById('saveBtn');
            btn.innerText = "✓ SAVED";
            btn.classList.replace('bg-indigo-700', 'bg-emerald-600');
            setTimeout(() => { btn.innerText = "SAVE NOTE"; btn.classList.replace('bg-emerald-600', 'bg-indigo-700'); }, 1500);
        }

        function markDirty() { isDirty = true; }

        function addActionRow(text = "", done = false) {
            const div = document.createElement('div');
            div.className = 'action-row flex items-center gap-4 mb-2';
            const status = document.createElement('div');
            status.className = 'status-box w-7 h-7 border-4 border-slate-300 rounded-lg cursor-pointer' + (done ? ' bg-indigo-600 border-indigo-600' : '');
            status.setAttribute('role', 'button');
            status.tabIndex = 0;
            status.addEventListener('click', () => { status.classList.toggle('bg-indigo-600'); status.classList.toggle('border-indigo-600'); markDirty(); });
            status.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); status.click(); } });
            const input = document.createElement('input');
            input.type = 'text';
            input.value = text;
            input.placeholder = 'Tactical action...';
            input.className = 'flex-1 bg-transparent outline-none font-black text-lg' + (done ? ' line-through opacity-40' : '');
            input.addEventListener('input', markDirty);
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); addActionRow(); }
            });
            const del = document.createElement('button');
            del.type = 'button';
            del.className = 'text-slate-400 px-2 font-black text-xs hover:text-red-500';
            del.textContent = '✕';
            del.addEventListener('click', () => { div.remove(); markDirty(); });
            div.appendChild(status);
            div.appendChild(input);
            div.appendChild(del);
            document.getElementById('actionContainer').appendChild(div);
        }

        function toggleVault() { const v = document.getElementById('vaultMenu'); if(v.classList.contains('hidden')) { document.getElementById('tagBuilder').innerHTML = ''; config.tags.forEach(t => addTagRow(t.name, t.color)); document.getElementById('projectBuilder').innerHTML = ''; config.projects.forEach(p => addProjectRow(p)); } v.classList.toggle('hidden'); }
        function addTagRow(n="", c="#6366f1") { const html = `<div class="tag-row flex gap-2"><input type="text" value="${escapeHtmlAttr(n)}" class="t-name-input flex-1 p-2 bg-white border-2 border-slate-400 rounded-xl font-bold text-xs uppercase"><input type="color" value="${escapeHtmlAttr(c)}" class="t-color-input w-10 h-10 border-none bg-transparent cursor-pointer"></div>`; document.getElementById('tagBuilder').insertAdjacentHTML('beforeend', html); }
        function addProjectRow(v="") { const html = `<div class="project-row flex gap-2"><input type="text" value="${escapeHtmlAttr(v)}" class="p-name-input flex-1 p-3 bg-white border-2 border-slate-400 rounded-xl font-bold text-xs uppercase"></div>`; document.getElementById('projectBuilder').insertAdjacentHTML('beforeend', html); }
        function applyVault() { config.tags = Array.from(document.querySelectorAll('.tag-row')).map(r => ({ name: r.querySelector('.t-name-input').value.trim().toUpperCase(), color: r.querySelector('.t-color-input').value })).filter(t => t.name); config.projects = Array.from(document.querySelectorAll('.project-row')).map(r => r.querySelector('.p-name-input').value.trim().toUpperCase()).filter(v => v); if(config.projects.length === 0) config.projects = ["CLIENT 1"]; localStorage.setItem('hub_config', JSON.stringify(config)); toggleVault(); syncNav(); renderCalendar(); }
        
        function downloadBackup() {
            try {
                const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'stratsilo_backup.json';
                a.click();
                URL.revokeObjectURL(a.href);
            } catch (e) {
                alert('Backup failed: ' + (e && e.message ? e.message : String(e)));
            }
        }

        function exportAllToCSV() {
            let csv = "Client,Date,Notes\n";
            config.projects.forEach(client => {
                const notes = db.entries[client] || {};
                Object.keys(notes).forEach(date => {
                    const entry = notes[date];
                    const plain = htmlToPlainText(entry.html || '');
                    csv += [csvEscapeField(client), csvEscapeField(date), csvEscapeField(plain)].join(',') + '\n';
                });
            });
            try {
                const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = 'StratSilo_Master_Export.csv';
                link.click();
                URL.revokeObjectURL(link.href);
            } catch (e) {
                alert('Export failed: ' + (e && e.message ? e.message : String(e)));
            }
        }

        function syncNav() {
            const sel = document.getElementById('activeProject');
            const cur = sel.value;
            sel.innerHTML = config.projects.map(p => `<option value="${escapeHtmlAttr(p)}">${escapeHtmlAttr(p)}</option>`).join('');
            if(config.projects.includes(cur)) sel.value = cur; else sel.value = config.projects[0];
        }

        function syncUI() { isSummarizedView = false; document.getElementById('masterBtn').classList.remove('summarized-active'); renderCalendar(); }
        function toggleMaster() { isSummarizedView = !isSummarizedView; document.getElementById('masterBtn').classList.toggle('summarized-active', isSummarizedView); renderCalendar(); }

        function handleDone() {
            if (isDirty && !window.confirm('Save changes before closing this note?')) return;
            if (!saveNoteLogic()) return;
            const modal = document.getElementById('editorModal');
            modal.classList.add('translate-y-full');
            setTimeout(() => { modal.classList.add('hidden'); activeKey = null; renderCalendar(); }, 300);
        }

        function navDay(dir) {
            if (isDirty && !window.confirm('Save changes before switching days?')) return;
            if (!saveNoteLogic()) return;
            const [y, m, d] = activeKey.split('-').map(Number);
            const n = new Date(y, m - 1, d + dir);
            openEditor(`${n.getFullYear()}-${n.getMonth() + 1}-${n.getDate()}`);
        }

        window.onload = boot;
    </script>
</body>
</html>
