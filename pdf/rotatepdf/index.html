<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate & Organize PDF | Private Editor | BSFreeTools</title>
    
    <meta name="description" content="Rotate, reorder, and delete PDF pages locally. 100% private, no file uploads.">
    <link rel="canonical" href="https://bsfreetools.com/pdf/rotatepdf/">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --bg-base: #080809;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
        }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, sans-serif;
            margin: 0; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .linear-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 0% 0%, rgba(255,255,255,0.03) 0%, transparent 40%), var(--bg-base);
        }

        .page-card { 
            background: var(--card-bg); 
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
            aspect-ratio: 1 / 1.3;
        }

        .page-card:hover { border-color: rgba(255,255,255,0.2); }

        .img-wrap {
            flex-grow: 1;
            width: 100%;
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .img-wrap img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .rot-0 { transform: rotate(0deg) scale(1); }
        .rot-90 { transform: rotate(90deg) scale(0.8); }
        .rot-180 { transform: rotate(180deg) scale(1); }
        .rot-270 { transform: rotate(270deg) scale(0.8); }

        .icon-row {
            height: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-action {
            padding: 14px 40px;
            background: #FFFFFF;
            color: #000000;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: transform 0.2s;
        }
        
        .btn-action:hover:not(:disabled) { transform: scale(1.05); }
        .btn-action:disabled { opacity: 0.3; cursor: wait; }

        .ad-container {
            width: 100%; max-width: 800px; height: 90px;
            margin: 60px auto; border: 1px dashed var(--card-border);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; opacity: 0.3; text-transform: uppercase;
        }

        .drag-active {
            border-color: #FFFFFF !important;
            background: rgba(255, 255, 255, 0.05) !important;
        }
    </style>
</head>
<body>

    <div class="linear-bg"></div>

    <nav class="p-6 flex justify-between items-center border-b border-white/5 bg-black/40 backdrop-blur-md sticky top-0 z-50">
        <a href="/pdf/" class="text-[10px] font-black tracking-widest opacity-50 hover:opacity-100 uppercase transition-opacity">← BACK</a>
        <span class="text-[10px] font-black tracking-[0.3em] uppercase opacity-80">BSFREETOOLS</span>
    </nav>

    <main class="max-w-6xl mx-auto p-10 text-center">
        <h1 class="text-5xl font-black italic uppercase tracking-tighter mb-4">ROTATE & ORGANIZE</h1>
        <p class="text-xs font-medium opacity-40 uppercase tracking-widest mb-12">Total Privacy • Browser-Side Processing • No Uploads</p>

        <div id="drop-zone" class="border-2 border-dashed border-white/10 rounded-[40px] p-24 cursor-pointer hover:bg-white/5 transition-all group" onclick="document.getElementById('pdf-input').click()">
            <p class="text-[10px] font-black uppercase tracking-[0.3em] opacity-30 group-hover:opacity-100 transition-opacity">DROP PDF OR CLICK TO LOAD</p>
            <input type="file" id="pdf-input" accept=".pdf" class="hidden">
        </div>

        <div id="workspace" class="hidden mt-12">
            <div class="flex justify-between items-center mb-10 px-4">
                <span class="text-[10px] font-black uppercase tracking-widest opacity-30 italic">Drag to Reorder • Click Trash to Delete • PG # is Reference</span>
                <button onclick="window.location.reload()" class="text-[10px] font-black uppercase tracking-widest text-rose-500 hover:underline">Clear Session</button>
            </div>
            
            <div id="page-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10 mb-20"></div>
            
            <div class="flex flex-col items-center gap-6">
                <button id="download-btn" class="btn-action">SAVE & DOWNLOAD PDF</button>
                <div id="status" class="text-[11px] font-black uppercase tracking-widest text-emerald-400 min-h-[1.5rem]"></div>
            </div>
        </div>
    </main>

    <div class="ad-container">Advertisement Space</div>

    <footer class="py-20 text-center opacity-20 border-t border-white/5">
        <p class="text-[10px] font-black uppercase tracking-[1em]">Distributed by BSFREETOOLS.COM</p>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        let originalBytes = null;
        const pageGrid = document.getElementById('page-grid');
        const dropZone = document.getElementById('drop-zone');

        // Global Drag & Drop Overrides
        window.addEventListener('dragover', e => {
            e.preventDefault();
            dropZone.classList.add('drag-active');
        });
        
        window.addEventListener('dragleave', e => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
        });
        
        window.addEventListener('drop', async e => {
            e.preventDefault();
            dropZone.classList.remove('drag-active');
            const file = Array.from(e.dataTransfer.files).find(f => f.type === 'application/pdf');
            if (file) {
                originalBytes = await file.arrayBuffer();
                document.getElementById('drop-zone').classList.add('hidden');
                document.getElementById('workspace').classList.remove('hidden');
                render();
            }
        });

        document.getElementById('pdf-input').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            originalBytes = await file.arrayBuffer();
            document.getElementById('drop-zone').classList.add('hidden');
            document.getElementById('workspace').classList.remove('hidden');
            render();
        };

        async function render() {
            // Buffer cloning to prevent locks
            const pdf = await pdfjsLib.getDocument({ data: originalBytes.slice(0) }).promise;
            pageGrid.innerHTML = '';
            
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 0.4 });
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.height = viewport.height; canvas.width = viewport.width;
                await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                const card = document.createElement('div');
                card.className = 'page-card';
                card.dataset.index = i - 1;
                card.innerHTML = `
                    <div class="img-wrap">
                        <img src="${canvas.toDataURL('image/jpeg', 0.6)}" class="rot-0 shadow-2xl rounded">
                    </div>
                    <div class="icon-row">
                        <button onclick="this.closest('.page-card').remove(); updateCheck()" class="text-rose-500 hover:scale-125 transition-transform p-2">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                        <span class="text-[10px] font-black opacity-20 tracking-tighter uppercase italic">PG ${i}</span>
                        <button onclick="rotate(this)" class="text-white/60 hover:text-white hover:scale-125 transition-transform p-2">
                            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8m0-5v5h-5"></path></svg>
                        </button>
                    </div>`;
                pageGrid.appendChild(card);
            }
            new Sortable(pageGrid, { animation: 200, ghostClass: 'opacity-0' });
        }

        function rotate(btn) {
            const img = btn.closest('.page-card').querySelector('img');
            const classes = Array.from(img.classList);
            const curClass = classes.find(c => c.startsWith('rot-'));
            const cur = curClass ? parseInt(curClass.split('-')[1]) : 0;
            img.classList.remove(`rot-${cur}`);
            img.classList.add(`rot-${(cur + 90) % 360}`);
        }

        function updateCheck() {
            if (pageGrid.children.length === 0) window.location.reload();
        }

        document.getElementById('download-btn').onclick = async () => {
            const status = document.getElementById('status');
            const btn = document.getElementById('download-btn');
            status.textContent = 'FINALIZING ASSETS...';
            btn.disabled = true;

            await new Promise(r => setTimeout(r, 50));

            try {
                const { PDFDocument, degrees } = PDFLib;
                
                // Safe loading of the ArrayBuffer
                const srcDoc = await PDFDocument.load(originalBytes.slice(0));
                const outDoc = await PDFDocument.create();
                
                const cards = Array.from(pageGrid.children);
                for (const card of cards) {
                    const [page] = await outDoc.copyPages(srcDoc, [parseInt(card.dataset.index)]);
                    
                    const img = card.querySelector('img');
                    const rotClass = Array.from(img.classList).find(c => c.startsWith('rot-'));
                    const rotValue = rotClass ? parseInt(rotClass.split('-')[1]) : 0;
                    
                    const existingRot = page.getRotation() ? page.getRotation().angle : 0;
                    page.setRotation(degrees((existingRot + rotValue) % 360));
                    
                    outDoc.addPage(page);
                }
                
                const bytes = await outDoc.save();
                const blob = new Blob([bytes], { type: 'application/pdf' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = "organized_fixed_bsfree.pdf";
                link.click();
                
                status.textContent = 'DOWNLOAD COMPLETE';
            } catch (err) {
                console.error(err);
                status.textContent = 'PROCESS ERROR - RETRY';
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
