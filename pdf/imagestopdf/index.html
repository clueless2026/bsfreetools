<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images to PDF | Private Browser Converter | BSFreeTools</title>
    
    <meta name="description" content="Convert JPG, PNG, and WebP images into a single PDF instantly in your browser. No uploads, total privacy.">
    <link rel="canonical" href="https://bsfreetools.com/pdf/imagestopdf/">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --bg-base: #080809;
            --card-bg: rgba(255, 255, 255, 0.015);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #FFFFFF;
            --text-secondary: #8A8A8E;
            --nav-bg: rgba(8, 8, 9, 0.8);
            --accent: #2563eb;
        }

        [data-theme="light"] {
            --bg-base: #E2E2E7; 
            --card-bg: #FFFFFF; 
            --card-border: rgba(0, 0, 0, 0.12);
            --text-main: #1D1D1F;
            --text-secondary: #424245;
            --nav-bg: rgba(226, 226, 231, 0.8);
            --accent: #007AFF;
        }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-secondary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            margin: 0; min-height: 100vh; -webkit-font-smoothing: antialiased;
            transition: background-color 0.5s ease;
        }

        .linear-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: radial-gradient(circle at 0% 0%, rgba(255,255,255,0.03) 0%, transparent 40%), var(--bg-base);
        }

        .tool-container {
            max-width: 1000px; margin: 160px auto 60px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 24px; padding: 3rem; text-align: center;
            backdrop-filter: blur(10px);
        }

        .drop-zone {
            border: 2px dashed var(--card-border);
            border-radius: 16px; padding: 40px; margin-bottom: 2rem;
            transition: all 0.3s ease; cursor: pointer;
        }

        .drop-zone:hover { border-color: var(--text-main); background: rgba(255,255,255,0.03); }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem; margin-top: 2rem;
        }

        .image-card {
            aspect-ratio: 1;
            background: #111;
            border-radius: 12px;
            position: relative;
            cursor: grab;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .image-card img { width: 100%; height: 100%; object-fit: cover; }

        .remove-btn {
            position: absolute; top: 4px; right: 4px;
            background: rgba(239, 68, 68, 0.9); color: white;
            width: 22px; height: 22px; border-radius: 50%;
            font-size: 14px; font-weight: bold; line-height: 20px;
            display: flex; align-items: center; justify-content: center;
        }

        .btn-primary {
            background: var(--text-main); color: var(--bg-base);
            padding: 14px 40px; border-radius: 99px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.15em; font-size: 12px;
            transition: transform 0.2s ease;
        }

        .btn-primary:hover:not(:disabled) { transform: scale(1.05); }
        .btn-primary:disabled { opacity: 0.3; cursor: not-allowed; }

        .ad-container {
            max-width: 800px; margin: 2rem auto;
            border: 1px dashed var(--card-border);
            height: 90px; display: flex; align-items: center; justify-content: center;
            font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em;
        }
    </style>
</head>
<body>

    <div class="linear-bg"></div>

    <nav class="fixed top-0 z-50 w-full px-10 py-6 flex items-center justify-between bg-[var(--nav-bg)] backdrop-blur-xl border-b border-[var(--card-border)]">
        <a href="/pdf/" class="text-[10px] font-bold uppercase tracking-[0.3em] text-[var(--text-main)] opacity-60 hover:opacity-100 transition-opacity">
            ← BACK TO PDF SUITE
        </a>
        <div class="flex items-center gap-6">
            <button onclick="toggleTheme()" class="text-[10px] font-bold uppercase tracking-widest text-[var(--text-main)] border border-[var(--card-border)] px-4 py-2 rounded-full" id="themeBtn">Light Mode</button>
        </div>
    </nav>

    <div class="tool-container">
        <h1 class="text-4xl font-black italic uppercase text-[var(--text-main)] tracking-tight leading-none">
            IMAGES TO PDF
        </h1>
        <p class="mt-6 text-sm font-medium leading-relaxed max-w-md mx-auto">
            Convert photos to a PDF document. Drag to reorder your images before generating the file.
        </p>

        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <p id="file-label" class="text-[10px] font-black uppercase tracking-[0.2em] text-[var(--text-main)]">
                Drop Images here or click to select
            </p>
            <input type="file" id="file-input" multiple accept="image/*" class="hidden" onchange="handleFileSelect(event)">
        </div>

        <div id="image-list" class="image-grid"></div>

        <div class="mt-8 flex flex-col items-center gap-4">
            <button id="convert-btn" onclick="generatePDF()" class="btn-primary" disabled>
                Generate PDF
            </button>
            <div id="status" class="text-[10px] font-black uppercase tracking-widest text-emerald-500 min-h-[1rem]"></div>
        </div>
    </div>

    <div class="ad-container">
        <span>Advertisement Space</span>
    </div>

    <footer class="mt-auto py-12 text-center">
        <div class="mb-6">
            <a href="https://ko-fi.com/bsfreetools" target="_blank" class="text-[10px] font-black uppercase tracking-widest opacity-40 hover:opacity-100 transition-opacity border border-white/10 px-6 py-2 rounded-full">
                Support via Ko-fi
            </a>
        </div>
        <p class="text-[10px] font-black uppercase tracking-[1em] opacity-20">Distributed by BSFREETOOLS.COM</p>
    </footer>

    <script>
        const { jsPDF } = window.jspdf;
        let stagedImages = [];

        const sortable = new Sortable(document.getElementById('image-list'), {
            animation: 150,
            onEnd: () => {
                const newList = [];
                document.querySelectorAll('.image-card').forEach(card => {
                    newList.push(stagedImages[card.dataset.id]);
                });
                stagedImages = newList;
                renderImages();
            }
        });

        window.addEventListener('dragover', e => e.preventDefault());
        window.addEventListener('drop', e => {
            e.preventDefault();
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            addFiles(files);
        });

        function handleFileSelect(e) {
            addFiles(Array.from(e.target.files));
            e.target.value = '';
        }

        function addFiles(files) {
            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    stagedImages.push({ name: file.name, src: e.target.result });
                    renderImages();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderImages() {
            const list = document.getElementById('image-list');
            list.innerHTML = '';
            stagedImages.forEach((img, i) => {
                const card = document.createElement('div');
                card.className = 'image-card';
                card.dataset.id = i;
                card.innerHTML = `
                    <img src="${img.src}">
                    <button class="remove-btn" onclick="event.stopPropagation(); removeImg(${i})">×</button>
                `;
                list.appendChild(card);
            });
            document.getElementById('convert-btn').disabled = stagedImages.length === 0;
            document.getElementById('file-label').textContent = stagedImages.length > 0 ? `${stagedImages.length} IMAGES LOADED` : `DROP IMAGES OR CLICK TO LOAD`;
        }

        function removeImg(i) {
            stagedImages.splice(i, 1);
            renderImages();
        }

        async function generatePDF() {
            const status = document.getElementById('status');
            const btn = document.getElementById('convert-btn');
            try {
                btn.disabled = true;
                status.textContent = 'Generating...';
                
                const pdf = new jsPDF();
                
                for (let i = 0; i < stagedImages.length; i++) {
                    const img = stagedImages[i];
                    // Create image element to get true dimensions
                    const imageEl = new Image();
                    imageEl.src = img.src;
                    
                    await new Promise(resolve => imageEl.onload = resolve);
                    
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (imageEl.height * pdfWidth) / imageEl.width;
                    
                    if (i > 0) pdf.addPage();
                    pdf.addImage(img.src, 'JPEG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');
                }

                pdf.save("bsfree_images.pdf");
                status.textContent = 'DONE';
            } catch (e) {
                status.style.color = '#ef4444';
                status.textContent = 'ERROR';
                console.error(e);
            } finally {
                btn.disabled = false;
            }
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById('themeBtn');
            if (body.getAttribute('data-theme') === 'light') {
                body.removeAttribute('data-theme');
                btn.innerText = 'Light Mode';
            } else {
                body.setAttribute('data-theme', 'light');
                btn.innerText = 'Dark Mode';
            }
        }
    </script>
</body>
</html>
